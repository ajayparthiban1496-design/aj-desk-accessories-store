# Minimal project config for the Supabase CLI. Run `supabase init` if you
# prefer the full generated file; these are the settings this app relies on.
project_id = "aj-desk"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/account", "http://localhost:5173/reset-password"]

[auth.email]
enable_confirmations = true

[auth.external.google]
enabled = false # set true and add credentials in the dashboard to enable Google sign-in
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"

[functions.stripe-webhook]
verify_jwt = false

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
